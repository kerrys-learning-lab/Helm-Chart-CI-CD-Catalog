# ============================================================================
spec:
  inputs:

    # ------------------------------------------------------------------------
    chart_dir:
      description:  See templates/pipeline.yml
      type: string
      default: .

    destination:
      description:  See templates/pipeline.yml
      type: string
      options:
        - oci
        - package
        - both
      default: both

    stage:
      description: Assigns the Pipeline stage for this Job
      type: string
      default: push

    mode:
      description:  See templates/pipeline.yml
      type: string
      options:
        - protected
        - skip
        - force
      default: protected

    job_name_prefix:
      description: Optional prefix for this Job's name
      type: string
      default: ''

    job_name_suffix:
      description: Optional suffix for this Job's name
      type: string
      default: ''


  component:
    - name
    - version
    - reference


---


# ============================================================================
include:
  - component: $CI_SERVER_FQDN/kerrys-learning-lab/devsecops/cicd-catalog/foundation/defaults@release/0.2
  - local: .push.gitlab-ci.yml


# ----------------------------------------------------------------------------
"$[[ inputs.job_name_prefix ]]helm push$[[ inputs.job_name_suffix ]]":
  extends: .helm-push
  stage: $[[ inputs.stage ]]
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
    HELM_CHART_DIR: $[[ inputs.chart_dir ]]
    HELM_DESTINATION: $[[ inputs.destination ]]
  rules:
    - if: '"$[[ inputs.mode ]]" == "skip"'
      when: never
    - if: '"$[[ inputs.mode ]]" == "force"'
    - !reference [.rules//if-protected-ref,  rules]
