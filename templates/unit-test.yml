# ============================================================================
spec:
  inputs:

    enabled:
      description:  If true, the Helm chart will be unit tested
      type: boolean
      default: true

    chart_dir:
      description: Relative path to the test chart contents (folder which contains
                   Chart.yaml)
      type: string
      default: .

    file_glob:
      description:  See templates/pipeline.yml
      type: string
      default: tests/*.tests.yaml

    stage:
      description: Assigns the Pipeline stage for this Job
      type: string
      default: test

    job_name_prefix:
      description: Optional prefix for this Job's name
      type: string
      default: ''

    job_name_suffix:
      description: Optional suffix for this Job's name
      type: string
      default: ''


  component:
    - name
    - version
    - reference


---


# ============================================================================
include:
  - component: $CI_SERVER_FQDN/kerrys-learning-lab/devsecops/cicd-catalog/foundation/defaults@main
  - local: .unit-test.gitlab-ci.yml


# ----------------------------------------------------------------------------
"$[[ inputs.job_name_prefix ]]helm unit-test$[[ inputs.job_name_suffix ]]":
  extends: .helm-unit-test
  stage: $[[ inputs.stage ]]
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
    HELM_CHART_DIR: $[[ inputs.chart_dir ]]
    HELM_UNITTEST_FILE_GLOB: $[[ inputs.file_glob ]]
  rules:
    - if: '"$[[ inputs.enabled ]]" == "false"'
      when: never
    - when: on_success
